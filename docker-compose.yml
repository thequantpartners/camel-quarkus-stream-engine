services:
  postgres:
    image: postgres:16-alpine
    container_name: stream-engine-postgres
    environment:
      POSTGRES_DB: stream_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stream_ledger"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stream-network

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: stream-engine-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'OK'"]
      interval: 8s
      timeout: 4s
      retries: 5
    networks:
      - stream-network

  stream-engine:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    container_name: stream-engine-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/stream_ledger
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      STREAM_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    networks:
      - stream-network

volumes:
  postgres_data:
  maven_cache:

networks:
  stream-network:
    driver: bridge
