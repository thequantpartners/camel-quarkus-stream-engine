name: CI / Cloud-Native Build & Architecture Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Java 21 & Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ArchUnit & Integration Tests
        run: mvn clean test -B

      - name: Package Quarkus Fast-JAR
        run: mvn package -DskipTests -B

      - name: Verify Docker Container Build
        run: |
          docker build -f Dockerfile.jvm -t camel-quarkus-stream-engine:latest .
