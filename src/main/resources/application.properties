# ==============================================================================
# Quarkus & Camel Stream Engine Configuration
# ==============================================================================

quarkus.application.name=camel-quarkus-stream-engine
quarkus.application.version=1.0.0

# HTTP Port
quarkus.http.port=8080

# ==============================================================================
# Database & Flyway Persistence
# ==============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/stream_ledger
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=none

# ==============================================================================
# Apache Camel Configurations
# ==============================================================================
camel.context.name=stream-engine-context
camel.main.tracing=false
stream.kafka.enabled=false

# ==============================================================================
# Observability (Health, Metrics, OpenAPI)
# ==============================================================================
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ==============================================================================
# Log Formatting
# ==============================================================================
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.quantpartners".level=DEBUG

# ==============================================================================
# Test Profile Overrides (%test)
# ==============================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
